<link href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<style>
:root{
  --paper:#FFFFFF; --wash:#F5F6F8; --wash2:#ECEEF1;
  --line:rgba(17,24,39,.09); --line2:rgba(17,24,39,.16);
  --ink:#111827; --ink2:#5A6472; --ink3:#98A0AC;
  --amber:#F5A300; --amber-ink:#8A5200; --amber-wash:#FFF6E3;
  --blue:#1A73E8; --blue-wash:#EAF2FE; --blue-line:#CFE0FC;
  --red:#D93025; --red-wash:#FDEDEC;
  --green:#137333; --green-wash:#E6F4EA;
  --r:14px; --rr:22px;
  --peek:74px; --mid:50vh; --topgap:126px; --sh:var(--mid);
  --safeb:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--wash);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
svg{display:block;flex:0 0 auto}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.85;
  stroke-linecap:round;stroke-linejoin:round}
.ic.s{width:16px;height:16px;stroke-width:2.1}
.ic.l{width:24px;height:24px;stroke-width:1.7}

#map{position:absolute;inset:0}
#scrim{position:absolute;top:0;left:0;right:0;height:calc(env(safe-area-inset-top) + 6px);
  background:linear-gradient(180deg,rgba(0,0,0,.42),rgba(0,0,0,.16) 60%,rgba(0,0,0,0));
  z-index:45;pointer-events:none}
.maplibregl-ctrl-attrib{font-size:9px!important;opacity:.55}
.maplibregl-ctrl-bottom-left{display:none}

/* ── TOP: floating search + chips ── */
#top{position:absolute;top:0;left:0;right:0;z-index:40;
  padding:calc(env(safe-area-inset-top) + 10px) 0 0;pointer-events:none}
#top>*{pointer-events:auto}
.searchwrap{padding:0 12px}
.search{display:flex;align-items:center;gap:11px;height:50px;background:var(--paper);
  border-radius:var(--rr);padding:0 16px;box-shadow:0 2px 6px rgba(17,24,39,.14),0 8px 24px rgba(17,24,39,.10)}
.search>.ic{color:var(--ink3)}
#q{flex:1;min-width:0;background:none;border:0;outline:none;padding:0;letter-spacing:-.01em}
#q::placeholder{color:var(--ink3)}
#qx{display:none;color:var(--ink2);padding:6px;margin:-6px}
#results{margin:10px 12px 0;background:var(--paper);border-radius:var(--r);overflow:hidden;
  display:none;max-height:48vh;overflow-y:auto;box-shadow:0 10px 30px rgba(17,24,39,.18)}
.res{display:flex;align-items:center;gap:13px;padding:13px 15px;
  border-bottom:1px solid var(--line);min-height:58px}
.res:last-child{border-bottom:0}
.res:active{background:var(--wash)}
.res .pico{width:34px;height:34px;border-radius:50%;background:var(--wash2);
  display:flex;align-items:center;justify-content:center;color:var(--ink2);flex:0 0 auto}
.res .t{min-width:0;flex:1}
.res b{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res span{display:block;font-size:12.5px;color:var(--ink2);margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── FLOATING CONTROLS ── */
.fabs{position:absolute;right:12px;bottom:calc(var(--sh) + 14px);z-index:35;
  display:flex;flex-direction:column;gap:10px;transition:bottom .32s cubic-bezier(.32,.72,0,1)}
.fab{width:46px;height:46px;border-radius:50%;background:var(--paper);color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 5px rgba(17,24,39,.18),0 6px 16px rgba(17,24,39,.12)}
.fab:active{background:var(--wash2)}
.fab.on{background:var(--blue);color:#fff}
#fCompass .ic{transition:transform .12s linear}

/* ── SHEET ── */
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:38;height:var(--sh);
  background:var(--paper);border-radius:var(--rr) var(--rr) 0 0;
  display:flex;flex-direction:column;box-shadow:0 -2px 8px rgba(17,24,39,.10),0 -12px 34px rgba(17,24,39,.14);
  transition:height .32s cubic-bezier(.32,.72,0,1)}
#grab{padding:9px 0 4px;display:flex;justify-content:center;flex:0 0 auto;touch-action:none}
#grab i{width:38px;height:5px;border-radius:3px;background:#D3D7DD;display:block}

#peek{display:none;align-items:center;gap:12px;width:100%;text-align:left;
  padding:2px 18px calc(6px + var(--safeb))}
body.peek #peek{display:flex}
body.peek #tabs,body.peek #body{display:none}
#peek .lab{flex:1;min-width:0}
#peek .lab b{display:block;font-size:14px;font-weight:600;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
#peek .lab em{font-style:normal;display:block;font-size:11.5px;color:var(--ink3);margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#peek .m{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;
  letter-spacing:-.035em;color:var(--ink)}
#peek .m small{font-size:11px;font-weight:600;color:var(--ink3);margin-left:2px;letter-spacing:0}
#peek .up{color:var(--ink3)}

#tabs{display:flex;padding:0 14px;flex:0 0 auto;border-bottom:1px solid var(--line)}
.tab{flex:1;color:var(--ink3);padding:10px 0 12px;font-size:13.5px;font-weight:600;
  border-bottom:2.5px solid transparent;margin-bottom:-1px;transition:color .15s}
.tab.on{color:var(--ink);border-bottom-color:var(--ink)}
#body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-bottom:calc(var(--safeb) + 26px)}
.pane{display:none;padding:14px 14px 0}
.pane.on{display:block}

.hdr{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 3px 9px}
.hdr h3{margin:0;font-size:12px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink3)}
.hdr button{font-size:13px;font-weight:600;color:var(--blue);padding:6px;margin:-6px}

/* hotel */
.hotel{background:var(--blue-wash);border:1px solid var(--blue-line);
  border-radius:var(--r);padding:15px;margin-bottom:11px}
.hotel .r1{display:flex;align-items:flex-start;gap:12px;margin-bottom:13px}
.hotel .r1 .ic{color:var(--blue);margin-top:1px}
.hotel .r1 b{font-size:15px;font-weight:700;letter-spacing:-.02em;line-height:1.3;
  display:block;color:#12326B}
.hotel .r1 em{font-style:normal;font-size:12.5px;color:#41618F;display:block;margin-top:3px}
.hotel .acts{display:flex;gap:8px}
.hotel .acts>*{flex:1;height:42px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;gap:7px;font-size:13px;font-weight:600;text-decoration:none;
  background:rgba(255,255,255,.8);color:#12326B}
.hotel .acts .go{background:var(--blue);color:#fff}
.hotel .acts>*:active{opacity:.75}

.lines{display:flex;flex-wrap:wrap;gap:7px;padding:0 3px 14px}

/* station card — light */
.stn{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);
  margin-bottom:10px;overflow:hidden;box-shadow:0 1px 3px rgba(17,24,39,.06);
  transition:box-shadow .2s,border-color .2s}
.stn.sel{border-color:var(--ink);box-shadow:0 3px 12px rgba(17,24,39,.13)}
.stn .head{display:flex;align-items:flex-start;gap:11px;padding:14px 15px 11px}
.stn .head .pico{width:34px;height:34px;border-radius:50%;background:var(--ink);
  display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 auto}
.stn .head .t{flex:1;min-width:0}
.stn .head b{display:block;font-size:15px;font-weight:600;letter-spacing:-.015em;
  line-height:1.25}
.stn .head em{font-style:normal;display:block;font-size:12.5px;color:var(--ink2);margin-top:2px}
.stn .head em .sep{color:var(--ink3);margin:0 5px}
.dirgrp{border-top:1px solid var(--line);padding:9px 15px 4px}
.dirlab{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink3);margin-bottom:3px}
.arr{display:flex;align-items:center;gap:10px;padding:7px 0}
.arr .to{flex:1;min-width:0;font-size:13px;color:var(--ink2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arr .m{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;
  letter-spacing:-.035em;color:var(--ink)}
.arr .m.soon{color:var(--green)}
.arr .m small{font-size:10.5px;font-weight:600;color:var(--ink3);margin-left:2px;letter-spacing:0}
.stn .foot{border-top:1px solid var(--line);padding:11px 15px;display:flex;gap:8px}
.stn .foot button{flex:1;height:38px;border-radius:9px;background:var(--wash);
  font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.stn .foot button:active{background:var(--wash2)}

.blt{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;
  justify-content:center;font-size:12.5px;font-weight:700;color:#fff;letter-spacing:-.03em;
  flex:0 0 auto;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
.blt.dark{color:#000}
.blt.sm{width:19px;height:19px;font-size:10.5px}
.blt.lg{width:30px;height:30px;font-size:15px}

/* segmented */
.seg{display:flex;background:var(--wash2);border-radius:11px;padding:3px;gap:3px;margin-bottom:11px}
.seg button{flex:1;height:38px;border-radius:8px;color:var(--ink2);font-size:13.5px;
  font-weight:600;transition:background .15s,color .15s}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(17,24,39,.16)}

.pts{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);
  margin-bottom:11px;overflow:hidden;box-shadow:0 1px 3px rgba(17,24,39,.06)}
.pt{display:flex;align-items:center;gap:13px;padding:13px 15px;min-height:54px}
.pt+.pt{border-top:1px solid var(--line)}
.pt .dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto}
.pt .dot.sq{border-radius:3px}
.pt .t{flex:1;min-width:0;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt .t.dim{color:var(--ink3)}
.pt button{font-size:13px;font-weight:600;color:var(--blue);flex:0 0 auto;padding:8px;margin:-8px}

/* mode rows */
.mode{display:flex;align-items:center;gap:14px;background:var(--paper);
  border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;margin-bottom:9px;
  box-shadow:0 1px 3px rgba(17,24,39,.06);width:100%;text-align:left}
.mode:active{background:var(--wash)}
.mode.hi{border-color:var(--ink);box-shadow:0 3px 12px rgba(17,24,39,.12)}
.mode .badge{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;flex:0 0 auto}
.mode.train .badge{background:var(--blue-wash);color:var(--blue)}
.mode.walk .badge{background:var(--green-wash);color:var(--green)}
.mode.bike .badge{background:#E8F5E9;color:#1B7B32}
.mode.taxi .badge{background:var(--amber-wash);color:var(--amber-ink)}
.mode .m{flex:1;min-width:0}
.mode .m b{font-size:15px;font-weight:600;letter-spacing:-.015em;
  display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mode .m em{font-style:normal;display:block;font-size:12.5px;color:var(--ink2);margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mode .n{text-align:right;flex:0 0 auto}
.mode .n b{display:block;font-size:20px;font-weight:700;letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;line-height:1.1}
.mode .n span{display:block;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums;
  margin-top:2px}

/* ── ITINERARY (Rome2Rio style) ── */
.itin{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);
  padding:4px 15px 8px;margin-bottom:11px;box-shadow:0 1px 3px rgba(17,24,39,.06)}
.leg{display:flex;gap:14px;padding:11px 0;position:relative}
.leg .rail{width:26px;flex:0 0 auto;display:flex;flex-direction:column;align-items:center}
.leg .node{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;flex:0 0 auto;z-index:2;background:var(--wash2);color:var(--ink2)}
.leg .node.start{background:var(--blue);color:#fff}
.leg .node.end{background:var(--red);color:#fff}
.leg .stem{flex:1;width:3px;border-radius:2px;margin:3px 0;background:var(--wash2);min-height:10px}
.leg .stem.solid{background:var(--legcolor,var(--blue))}
.leg .stem.dash{background:repeating-linear-gradient(180deg,var(--ink3) 0 4px,transparent 4px 8px);
  width:3px}
.leg .c{flex:1;min-width:0;padding-bottom:2px}
.leg .c b{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.leg .c p{margin:3px 0 0;font-size:12.5px;color:var(--ink2);line-height:1.45}
.leg .c .badge2{display:inline-flex;align-items:center;gap:7px;background:var(--wash);
  border-radius:9px;padding:7px 10px;margin-top:8px;font-size:13px;font-weight:600}
.leg .time{font-size:12.5px;color:var(--ink3);font-variant-numeric:tabular-nums;
  flex:0 0 auto;padding-top:2px}
.plat{display:flex;align-items:center;gap:9px;background:var(--amber-wash);
  border:1px solid #F5DFB0;border-radius:10px;padding:10px 12px;margin-top:9px}
.plat .ic{color:var(--amber-ink)}
.plat span{font-size:13px;font-weight:600;color:#6E4200;line-height:1.35}
.plat span em{font-style:normal;display:block;font-weight:500;color:#8A6320;font-size:12px;margin-top:1px}

/* fare cap */
.cap{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin-bottom:11px;box-shadow:0 1px 3px rgba(17,24,39,.06)}
.cap .row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.cap .row b{font-size:26px;font-weight:700;letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.cap .row b span{font-size:14px;color:var(--ink3);font-weight:500;letter-spacing:-.01em}
.cap .row em{font-style:normal;font-size:12px;color:var(--ink2);text-align:right;line-height:1.35}
.cap .bar{height:8px;border-radius:99px;background:var(--wash2);overflow:hidden;margin:13px 0 10px}
.cap .bar i{display:block;height:100%;border-radius:99px;background:var(--amber);

.cap.done .bar i{background:var(--green)}
.cap .sub{font-size:13px;color:var(--ink2);margin-bottom:14px;line-height:1.45}
.cap .sub b{color:var(--green)}
.cap .btns{display:flex;gap:8px}
.cap .btns button{flex:1;height:44px;border-radius:10px;background:var(--wash);
  font-size:13.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.cap .btns .add{background:var(--ink);color:#fff;flex:2}
.cap .btns button:active{opacity:.8}

.btn{width:100%;height:50px;border-radius:var(--r);background:var(--ink);color:#fff;
  font-size:14.5px;font-weight:600;display:flex;align-items:center;justify-content:center;
  gap:9px;margin-bottom:10px}
.btn:active{opacity:.84}
.btn.ghost{background:var(--paper);color:var(--ink);border:1px solid var(--line2)}
.btn.blue{background:var(--blue);color:#fff}
.btn.sm{height:44px;font-size:13.5px}
.trio{display:flex;gap:8px;margin-bottom:12px}
.trio a{flex:1;text-decoration:none}
.trio .btn{margin:0}

.sv{display:flex;align-items:center;background:var(--paper);border:1px solid var(--line);
  border-radius:var(--r);margin-bottom:9px;padding:0 8px 0 15px;min-height:60px;
  box-shadow:0 1px 3px rgba(17,24,39,.06)}
.sv .go{flex:1;display:flex;align-items:center;gap:13px;min-width:0;padding:12px 0;text-align:left}
.sv .pico{width:34px;height:34px;border-radius:50%;background:var(--wash2);color:var(--ink2);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.sv .m{min-width:0;flex:1}
.sv .m b{display:block;font-size:14.5px;font-weight:600;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.sv .m em{font-style:normal;display:block;font-size:12px;color:var(--ink3);margin-top:1px}
.sv .del{width:40px;height:40px;display:flex;align-items:center;justify-content:center;
  color:var(--ink3);border-radius:50%;flex:0 0 auto}
.sv .del:active{background:var(--wash2)}

.tip{background:var(--blue-wash);border:1px solid var(--blue-line);border-radius:var(--r);
  padding:14px;margin-bottom:11px;display:flex;gap:12px;align-items:flex-start}
.tip .ic{color:var(--blue);margin-top:1px}
.tip .m{flex:1;min-width:0}
.tip .m b{display:block;font-size:14px;font-weight:600;margin-bottom:3px;color:#12326B}
.tip .m p{margin:0;font-size:12.5px;color:#41618F;line-height:1.5}
.tip .del{color:#5B7CAD;padding:4px;margin:-4px}

.note{font-size:12px;color:var(--ink3);line-height:1.55;padding:4px 3px 18px}
.warn{background:var(--red-wash);border:1px solid #F5C9C5;border-radius:var(--r);
  padding:14px 15px;margin-bottom:10px}
.warn b{display:block;font-size:14px;margin-bottom:4px;color:#8C2018}
.warn p{margin:0;font-size:12.5px;color:#A34A42;line-height:1.5}
.empty{text-align:center;padding:30px 20px 26px}
.empty .ic{width:32px;height:32px;color:var(--ink3);margin:0 auto 12px;stroke-width:1.5}
.empty b{display:block;font-size:15.5px;font-weight:600;margin-bottom:5px}
.empty p{margin:0 auto;font-size:13px;color:var(--ink2);max-width:255px;line-height:1.55}
.skel{height:82px;background:linear-gradient(90deg,var(--wash),#FAFBFC,var(--wash));
  background-size:200% 100%;border-radius:var(--r);margin-bottom:10px;
  animation:sh 1.3s linear infinite;border:1px solid var(--line)}
@keyframes sh{to{background-position:-200% 0}}

#toast{position:absolute;left:50%;bottom:calc(var(--sh) + 22px);transform:translate(-50%,14px);
  z-index:60;background:#202124;color:#fff;border-radius:99px;padding:12px 20px;font-size:13.5px;
  box-shadow:0 8px 24px rgba(17,24,39,.35);opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s,bottom .32s;
  white-space:nowrap;max-width:88vw;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* markers */
.mk{cursor:pointer}
.mk-stn{width:26px;height:26px;border-radius:50%;background:var(--ink);border:2.5px solid #fff;
  display:flex;align-items:center;justify-content:center;box-shadow:0 2px 7px rgba(17,24,39,.4);
  transition:transform .16s;color:#fff}
.mk-stn .ic{width:13px;height:13px;stroke-width:2.2}
.mk-stn.sel{transform:scale(1.22);background:var(--blue)}
.mk-me{position:relative;width:20px;height:20px}
.mk-me .dot{position:absolute;inset:0;border-radius:50%;background:var(--blue);
  border:3px solid #fff;box-shadow:0 0 0 6px rgba(26,115,232,.18),0 2px 6px rgba(17,24,39,.35)}
.mk-me .cone{position:absolute;left:50%;top:50%;width:0;height:0;
  border-left:15px solid transparent;border-right:15px solid transparent;
  border-bottom:34px solid rgba(26,115,232,.30);
  transform-origin:50% 100%;transform:translate(-50%,-100%) rotate(0deg);
  display:none;filter:blur(.3px)}
.mk-me.head .cone{display:block}
.mk-pin{width:26px;height:26px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
  border:2.5px solid #fff;box-shadow:0 3px 9px rgba(17,24,39,.4);
  display:flex;align-items:center;justify-content:center;color:#fff}
.mk-pin .ic{width:13px;height:13px;stroke-width:2.3}
.mk-pin.dest{background:var(--red)}
.mk-pin.hotel{background:var(--blue)}
.mk-pin.poi{background:#7C3AED;width:22px;height:22px}
.mk-pin.poi .ic{width:11px;height:11px}
.mk-ent{width:18px;height:18px;border-radius:50%;background:#5F6368;border:2px solid #fff;
  display:flex;align-items:center;justify-content:center;font-size:8.5px;font-weight:800;
  color:#fff;box-shadow:0 2px 5px rgba(17,24,39,.4)}
.mk-ent.acc{background:var(--green)}
.mk-ent.best{background:var(--blue);width:22px;height:22px;font-size:10px}
.entline{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);margin-top:7px}
.entline .dot{width:17px;height:17px;border-radius:50%;background:#5F6368;
  display:flex;align-items:center;justify-content:center;font-size:8.5px;font-weight:800;
  color:#fff;flex:0 0 auto}
.entline .dot.acc{background:var(--green)}
.entline b{color:var(--ink);font-weight:600}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

/* ── CITYWIDE SUBWAY LAYER ──
   Every station and every street entrance in the system, not just the ones near you. */
const SOC='https://data.ny.gov/resource/';
async function loadCitywide(){
  try{
    const r=await fetch(SOC+'39hk-dx4f.json?$select=stop_name,daytime_routes,gtfs_latitude,'
      +'gtfs_longitude,north_direction_label,south_direction_label,ada,borough&$limit=600');
    if(!r.ok)throw 0;
    const j=await r.json();
    S.allStn=j.map(s=>({name:s.stop_name,routes:(s.daytime_routes||'').trim().split(/\s+/).filter(Boolean),
      lat:+s.gtfs_latitude,lng:+s.gtfs_longitude,
      nLab:s.north_direction_label||'',sLab:s.south_direction_label||'',
      ada:s.ada==='1'||s.ada===1||s.ada===true})).filter(s=>!isNaN(s.lat));
    addStationLayer();
  }catch(e){console.warn('citywide stations',e)}
  try{
    const r=await fetch(SOC+"i9wp-a4ja.json?$select=entrance_latitude,entrance_longitude,"
      +"entrance_type&$where=entry_allowed='YES'&$limit=2500");
    if(!r.ok)throw 0;
    const j=await r.json();
    addEntranceLayer(j.map(e=>({lat:+e.entrance_latitude,lng:+e.entrance_longitude,
      type:e.entrance_type||'Door'})).filter(e=>!isNaN(e.lat)));
  }catch(e){console.warn('citywide entrances',e)}
}

function longPress(){
  const c=map.getCanvas();let tm=null,sx=0,sy=0,ll=null;
  const rel=p=>{const r=c.getBoundingClientRect();return[p.clientX-r.left,p.clientY-r.top]};
  const go=(x,y,pt)=>{sx=x;sy=y;ll=pt;tm=setTimeout(()=>{tm=null;
    if(navigator.vibrate)try{navigator.vibrate(18)}catch(e){}
    setDest(ll.lat,ll.lng,'Dropped pin')},520)};
  const mv=(x,y)=>{if(tm&&(Math.abs(x-sx)>12||Math.abs(y-sy)>12)){clearTimeout(tm);tm=null}};
  const end=()=>{if(tm){clearTimeout(tm);tm=null}};
  c.addEventListener('touchstart',e=>{if(e.touches.length!==1)return end();
    const t=e.touches[0];go(t.clientX,t.clientY,map.unproject(rel(t)))},{passive:true});
  c.addEventListener('touchmove',e=>{const t=e.touches[0];if(t)mv(t.clientX,t.clientY)},{passive:true});
  c.addEventListener('touchend',end,{passive:true});
  c.addEventListener('touchcancel',end,{passive:true});
  c.addEventListener('mousedown',e=>go(e.clientX,e.clientY,map.unproject(rel(e))));
  c.addEventListener('mousemove',e=>mv(e.clientX,e.clientY));
  c.addEventListener('mouseup',end);
}

async function get(k,def){
  try{const r=await window.storage.get('nn:'+k);return r?JSON.parse(r.value):def}
  catch(e){try{const v=localStorage.getItem('nn:'+k);return v?JSON.parse(v):def}catch(e2){return def}}

  const s=JSON.stringify(v);
  try{await window.storage.set('nn:'+k,s)}catch(e){try{localStorage.setItem('nn:'+k,s)}catch(e2){}}
}

function locate(recenter){
  if(!navigator.geolocation){toast("This browser can't share location");return}
  $('fLoc').classList.add('on');
  if(lw!==null)navigator.geolocation.clearWatch(lw);
  lw=navigator.geolocation.watchPosition(p=>{
    const first=!S.me;

    if(S.meMk)S.meMk.setLngLat([S.me.lng,S.me.lat]);else makeMe();

  },err=>{

    toast(err.code===1?'Location is off — enable it in Settings':'No GPS fix yet');
    if(S.tab==='near'&&!S.stations.length)fetchNearby();
  },{enableHighAccuracy:true,timeout:12000,maximumAge:20000});
}
function onOrient(e){
  let h=null;
  if(typeof e.webkitCompassHeading==='number')h=e.webkitCompassHeading;
  else if(e.absolute&&typeof e.alpha==='number')h=360-e.alpha;
  if(h==null||isNaN(h))return;
  S.heading=h;
  if(S.meMk){
    const el=S.meMk.getElement().querySelector('.mk-me');
    if(el){el.classList.add('head');
      const cone=el.querySelector('.cone');
      const b=mapOK?map.getBearing():0;
      cone.style.transform=`translate(-50%,-100%) rotate(${h-b}deg)`;}
  }
}
/* iOS needs a user gesture before it will grant motion access, so we arm the
   request on the first tap anywhere and enable silently everywhere else. */
function autoCompass(){
  const needsGesture = typeof DeviceOrientationEvent!=='undefined'
    && typeof DeviceOrientationEvent.requestPermission==='function';
  if(!needsGesture){ enableHeading(true); return; }
  const arm=()=>{
    document.removeEventListener('touchend',arm);
    document.removeEventListener('click',arm);
    enableHeading(true);
  };
  document.addEventListener('touchend',arm,{once:true,passive:true});
  document.addEventListener('click',arm,{once:true});
}
async function enableHeading(silent){
  if(S.headOn)return;
  try{
    if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission){
      const st=await DeviceOrientationEvent.requestPermission();
      if(st!=='granted'){ if(!silent)toast('Compass permission denied'); return; }
    }
  }catch(e){ if(!silent)toast('Compass unavailable on this device'); return; }
  addEventListener('deviceorientationabsolute',onOrient,true);
  addEventListener('deviceorientation',onOrient,true);
  S.headOn=true;$('fCompass').classList.add('on');
  if(!silent)toast('Compass on — the cone shows which way you face');
}
async function toggleHeading(){
  if(S.headOn){
    removeEventListener('deviceorientation',onOrient);
    removeEventListener('deviceorientationabsolute',onOrient);
    S.headOn=false;$('fCompass').classList.remove('on');
    if(S.meMk){const el=S.meMk.getElement().querySelector('.mk-me');if(el)el.classList.remove('head')}
    if(mapOK)map.easeTo({bearing:0});
    toast('Compass off');return;
  }
  enableHeading(false);
}

/* ── MATH ── */
function hav(a,b,c,d){const R=3958.8,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r;
  const h=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;
  return 2*R*Math.asin(Math.sqrt(h))}
const wSec=(a,b,c,d)=>hav(a,b,c,d)*1.32/3.1*3600;
const wMin=(a,b,c,d)=>Math.max(1,Math.round(wSec(a,b,c,d)/60));
const fm=s=>s<60?'1':String(Math.round(s/60));
const clock=s=>{const d=new Date(Date.now()+s*1000);
  return d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})};

function taxi(mi,min,f,t){
  let v=3+Math.ceil(mi*5)*.7+Math.max(0,min-mi*3)*.7+1.5;
  const n=new Date(),h=n.getHours(),wd=n.getDay()>0&&n.getDay()<6,tags=[];
  if(h>=20||h<6){v+=1;tags.push('overnight')}
  if(wd&&h>=16&&h<20){v+=2.5;tags.push('rush hour')}
  if(f.lat<40.786||t.lat<40.786){v+=2.5;tags.push('congestion')}
  if(f.lat<40.7648||t.lat<40.7648)v+=.75;
  return{v,tags}}

/* ── FEEDS ── */
const RELAYS=[u=>u,
  u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),
  u=>'https://corsproxy.io/?url='+encodeURIComponent(u),
  u=>'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(u)];

async function relayJSON(url,ms){
  let why='no response';
  for(const w of RELAYS){
    try{
      const c=new AbortController(),t=setTimeout(()=>c.abort(),ms||8000);
      let r;try{r=await fetch(w(url),{signal:c.signal})}finally{clearTimeout(t)}
      if(!r.ok){why='HTTP '+r.status;continue}
      return await r.json();
    }catch(e){why=e.name==='AbortError'?'timed out'
      :/fetch|network|load failed/i.test(e.message||'')?'blocked by browser':(e.message||'failed')}
  }
  throw new Error(why);
}
const stationsCache={};
async function stationsNear(lat,lng){
  const k=lat.toFixed(3)+','+lng.toFixed(3);
  if(stationsCache[k])return stationsCache[k];
  const j=await relayJSON(`https://api.wheresthefuckingtrain.com/by-location?lat=${lat}&lon=${lng}`);
  if(!j||!Array.isArray(j.data))throw new Error('unexpected data');
  stationsCache[k]=j.data;
  setTimeout(()=>{delete stationsCache[k]},40000);
  return j.data;
}
async function fetchNearby(){
  const at=S.me||{lat:HOTEL.lat,lng:HOTEL.lng};
  if(!S.stations.length)$('p-near').innerHTML=hotelCard()+'<div class="skel"></div><div class="skel"></div>';
  try{
    S.stations=await stationsNear(at.lat,at.lng);
    renderNearby();plotStations();renderPeek();loadEntrances();
  }catch(e){
    $('p-near').innerHTML=hotelCard()+
     `<div class="warn"><b>Live train times unavailable</b>
      <p>Couldn't reach the MTA feed (${e.message}). Directions, fares and the map still work.</p></div>
      <button class="btn ghost sm" onclick="fetchNearby()">Try again</button>`;
  }
}

/* ── ENTRANCES ── */
const ENT_LABEL={Stair:'Stairs',Escalator:'Escalator',Elevator:'Elevator',
  'Station House':'Station house','Easement - Street':'Street entrance',
  'Easement - Passage':'Passage',Ramp:'Ramp',Door:'Entrance'};
const ENT_L={Stair:'S',Escalator:'E',Elevator:'L','Station House':'H',
  'Easement - Street':'D','Easement - Passage':'P',Ramp:'R',Door:'D'};
const entKey=st=>st.name+'|'+st.location[0].toFixed(4);
async function fetchEnt(st){
  const k=entKey(st);
  if(S.ent[k]!==undefined)return S.ent[k];
  S.ent[k]=null;
  const url=`https://data.ny.gov/resource/i9wp-a4ja.json?$where=within_circle(entrance_georeference,${st.location[0]},${st.location[1]},350)&$limit=40`;
  try{
    const c=new AbortController(),t=setTimeout(()=>c.abort(),8000);
    let r;try{r=await fetch(url,{signal:c.signal})}finally{clearTimeout(t)}
    if(!r.ok)throw 0;
    const j=await r.json();
    S.ent[k]=j.map(e=>({lat:+e.entrance_latitude,lng:+e.entrance_longitude,
      type:e.entrance_type||'Door',entry:e.entry_allowed==='YES'}))
      .filter(e=>!isNaN(e.lat)&&!isNaN(e.lng)&&e.entry);
  }catch(e){S.ent[k]=[]}
  return S.ent[k];
}
async function loadEntrances(){
  await Promise.all(S.stations.slice(0,5).map(fetchEnt));
  if(S.tab==='near')renderNearby();
}
function bestEntrance(at,st){
  const l=S.ent[entKey(st)];
  if(!l||!l.length)return null;
  let best=null,bd=Infinity;
  l.forEach(e=>{const d=hav(at.lat,at.lng,e.lat,e.lng);if(d<bd){bd=d;best=e}});
  return best?{...best,mi:bd,min:Math.max(1,Math.round(bd*1.32/3.1*60))}:null;
}
function entLine(at,st){
  const l=S.ent[entKey(st)];
  if(l===undefined)return `<div class="entline">Finding entrances…</div>`;
  const b=bestEntrance(at,st);
  if(!b)return '';
  return `<div class="entline"><span class="dot${b.type==='Elevator'?' acc':''}">${ENT_L[b.type]||'D'}</span>
    Closest way in: <b>${ENT_LABEL[b.type]||b.type}</b> · ${b.min} min</div>`;
}
function plotEntrances(idx){
  S.entMk.forEach(m=>m.remove());S.entMk=[];
  if(idx===null||!mapOK)return;
  const st=S.stations[idx],l=S.ent[entKey(st)];
  if(!l||!l.length)return;
  const at=S.me||{lat:HOTEL.lat,lng:HOTEL.lng};
  const b=bestEntrance(at,st);
  l.forEach(e=>{
    const isBest=b&&e.lat===b.lat&&e.lng===b.lng;
    const acc=e.type==='Elevator';
    S.entMk.push(mk(e.lng,e.lat,
      `<div class="mk-ent${acc?' acc':''}${isBest?' best':''}">${ENT_L[e.type]||'D'}</div>`,
      ()=>toast(`${ENT_LABEL[e.type]||e.type}${isBest?' · closest to you':''}`)));
  });
}

async function focusStation(lat,lng,name){

/* ── ROUTING ── */
async function valhalla(f,t,costing){
  const c=new AbortController(),tm=setTimeout(()=>c.abort(),9000);
  try{
    const r=await fetch('https://valhalla1.openstreetmap.de/route?json='+
      encodeURIComponent(JSON.stringify({locations:[{lat:f.lat,lon:f.lng},{lat:t.lat,lon:t.lng}],
      costing,directions_options:{units:'miles'}})),{signal:c.signal});
    if(!r.ok)throw 0;
    const j=await r.json();
    if(!j.trip||!j.trip.summary)throw 0;
    return{sec:j.trip.summary.time,mi:j.trip.summary.length,
      shape:(j.trip.legs||[]).map(l=>l.shape).filter(Boolean)};
  }finally{clearTimeout(tm)}
}
const guess=(f,t,mph)=>{const mi=hav(f.lat,f.lng,t.lat,t.lng)*1.32;
  return{sec:mi/mph*3600,mi,shape:null,est:true}};
function poly(s){let i=0,la=0,ln=0,o=[],sh,re,by;
  while(i<s.length){sh=0;re=0;
    do{by=s.charCodeAt(i++)-63;re|=(by&31)<<sh;sh+=5}while(by>=32);
    la+=(re&1)?~(re>>1):(re>>1);sh=0;re=0;
    do{by=s.charCodeAt(i++)-63;re|=(by&31)<<sh;sh+=5}while(by>=32);
    ln+=(re&1)?~(re>>1):(re>>1);o.push([ln/1e6,la/1e6])}
  return o}
const shapeCoords=r=>r.shape&&r.shape.length?r.shape.flatMap(poly):null;

/* transit plan: find a shared line between a station near you and one near the destination */
async function planTransit(f,d){
  const crow=hav(f.lat,f.lng,d.lat,d.lng);
  if(crow<.5)return null;
  let oList=S.stations,dList=[];
  try{
    if(!oList.length)oList=await stationsNear(f.lat,f.lng);
    dList=await stationsNear(d.lat,d.lng);
  }catch(e){return null}
  if(!oList.length||!dList.length)return null;

  let best=null;
  oList.slice(0,5).forEach(o=>{
    const oR=routesAt(o);
    dList.slice(0,5).forEach(x=>{
      if(o.name===x.name)return;
      const shared=[...routesAt(x)].filter(r=>oR.has(r));
      if(!shared.length)return;
      const w1=wSec(f.lat,f.lng,o.location[0],o.location[1]);
      const w2=wSec(x.location[0],x.location[1],d.lat,d.lng);
      const score=w1+w2;
      if(!best||score<best.score)best={score,o,x,shared,w1,w2};
    });
  });
  if(!best)return null;

  const northbound=best.x.location[0]>best.o.location[0];
  const dirKey=northbound?'N':'S';
  const sg=signLabels(best.o.location[0],best.o.location[1]);
  const dirLabel=(sg&&(northbound?sg.n:sg.s))||(northbound?'Uptown':'Downtown');
  const next=(best.o[dirKey]||[])
    .filter(t=>best.shared.includes(t.route))
    .map(t=>({r:t.route,s:minsOf(t.time)*60}))
    .filter(t=>t.s>-30).sort((a,b)=>a.s-b.s)[0];

  const route=next?next.r:best.shared[0];
  const wait=next?Math.max(0,next.s):300;
  const ride=hav(best.o.location[0],best.o.location[1],best.x.location[0],best.x.location[1])/17*3600+60;
  await fetchEnt(best.o);
  const ent=bestEntrance(f,best.o);

  return {board:best.o,alight:best.x,route,shared:best.shared,dirLabel,northbound,
    w1:best.w1,w2:best.w2,wait,ride,ent,
    total:best.w1+wait+ride+best.w2};
}

async function plan(){
  if(!S.dest||!from()){renderTrip();return}
  const f=from(),d=S.dest;
  S.busy=true;renderTrip();
  const [w,b,c,tr]=await Promise.all([
    valhalla(f,d,'pedestrian').catch(()=>guess(f,d,3.1)),
    valhalla(f,d,'bicycle').catch(()=>guess(f,d,9.5)),
    valhalla(f,d,'auto').catch(()=>guess(f,d,11)),
    planTransit(f,d).catch(()=>null)]);
  S.trip={w,b,c,tr,fare:taxi(c.mi,c.sec/60,f,d),f};
  S.busy=false;renderTrip();
  drawTrip();
}
async function drawTrip(){
  const t=S.trip;if(!t||!mapOK)return;
  const f=t.f,d=S.dest,feats=[];
  if(t.tr){
    const legA=await valhalla(f,{lat:t.tr.ent?t.tr.ent.lat:t.tr.board.location[0],
      lng:t.tr.ent?t.tr.ent.lng:t.tr.board.location[1]},'pedestrian').catch(()=>null);
    const legB=await valhalla({lat:t.tr.alight.location[0],lng:t.tr.alight.location[1]},d,'pedestrian').catch(()=>null);
    const ca=legA&&shapeCoords(legA), cb=legB&&shapeCoords(legB);
    if(ca)feats.push(line(ca,'#5F6368',true));
    feats.push(line([[t.tr.board.location[1],t.tr.board.location[0]],
      [t.tr.alight.location[1],t.tr.alight.location[0]]],LINES[t.tr.route]||'#1A73E8',false));
    if(cb)feats.push(line(cb,'#5F6368',true));
  }else{
    const cw=shapeCoords(t.w);
    if(cw)feats.push(line(cw,'#1A73E8',false));
  }
  drawFeatures(feats);
  const all=feats.flatMap(x=>x.geometry.coordinates);
  if(all.length)try{
    map.fitBounds(all.reduce((x,p)=>x.extend(p),new maplibregl.LngLatBounds(all[0],all[0])),
      {padding:{top:140,bottom:Math.round(innerHeight*.55),left:48,right:48}})}catch(e){}
}

      <p style="margin-top:9px">Next train in ${Math.round(tr.wait/60)} min · about ${Math.round(tr.ride/60)} min on board${tr.shared.length>1?` · ${tr.shared.filter(r=>r!==tr.route).map(r=>blt(r,'sm')).join(' ')} also work`:''}</p></div>
    <span class="time">${clock(t0)}</span></div>`);
  t0+=tr.wait+tr.ride;
  rows.push(`<div class="leg"><div class="rail">
      <span class="node">${ico('walk','s')}</span><span class="stem dash"></span></div>
    <div class="c"><b>Get off at ${tr.alight.name}</b>

  return `<div class="itin">${rows.join('')}</div>`;
}

    <div class="hdr"><h3>Open in another app</h3></div><div class="trio">
    <a href="https://m.uber.com/ul/?action=setPickup&pickup[latitude]=${f.lat}&pickup[longitude]=${f.lng}&dropoff[latitude]=${d.lat}&dropoff[longitude]=${d.lng}" target="_blank" rel="noopener"><button class="btn ghost sm">Uber</button></a>
    <a href="https://lyft.com/ride?id=lyft&pickup[latitude]=${f.lat}&pickup[longitude]=${f.lng}&destination[latitude]=${d.lat}&destination[longitude]=${d.lng}" target="_blank" rel="noopener"><button class="btn ghost sm">Lyft</button></a>
    <a href="https://www.google.com/maps/dir/?api=1&origin=${f.lat},${f.lng}&destination=${d.lat},${d.lng}&travelmode=transit" target="_blank" rel="noopener"><button class="btn ghost sm">Maps</button></a></div>
    <div class="note">Subway times combine live MTA arrivals with a 17 mph average ride speed, so treat the on-board leg as an estimate. Taxi fare uses the official TLC formula — $3.00 initial, $0.70 per ⅕ mile, plus whichever surcharges apply right now. Tolls and tip not included.</div>`;
  $('p-trip').innerHTML=h;
}

/* ── FARE CAP + SAVED ── */
const taps7=()=>{const cut=Date.now()-7*864e5;return S.taps.filter(t=>t>cut)};
async function addTap(){
  const t=taps7();
  if(t.length&&Date.now()-Math.max(...t)<9e5){toast("Taps under 15 min apart don't count");return}
  S.taps=[...t,Date.now()];await put('taps',S.taps);renderSaved();
  const spent=Math.min(CAP,S.taps.length*FARE);
  toast(spent>=CAP?'Capped — rides are free now':`$${spent.toFixed(2)} of $${CAP} this week`);
}
async function undoTap(){
  const t=taps7();if(!t.length){toast('Nothing to undo');return}
  t.sort((a,b)=>a-b);t.pop();S.taps=t;await put('taps',S.taps);renderSaved();toast('Removed');
}
function capCard(){
  const t=taps7(),spent=Math.min(CAP,t.length*FARE),done=spent>=CAP;
  const left=Math.max(0,Math.ceil((CAP-spent)/FARE));
  const next=t.length?new Date(Math.min(...t)+7*864e5):null;
  return `<div class="cap${done?' done':''}">
    <div class="row"><b>$${spent.toFixed(2)} <span>of $${CAP.toFixed(0)}</span></b>
      <em>${t.length} ride${t.length===1?'':'s'}<br>in 7 days</em></div>
    <div class="bar"><i style="width:${Math.min(100,spent/CAP*100)}%"></i></div>
    <div class="sub">${done
      ? `<b>Capped — every ride is free</b> until ${next?next.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}):'the window rolls'}.`
      : `${left} more paid ride${left===1?'':'s'} and the rest of the week is free.`}</div>
    <div class="btns"><button class="add" onclick="addTap()">${ico('plus','s')}I tapped in</button>
      <button onclick="undoTap()">Undo</button></div></div>`;
}
async function saveDest(){
  if(!S.dest)return;
  if(S.saved.some(s=>Math.abs(s.lat-S.dest.lat)<1e-5&&Math.abs(s.lng-S.dest.lng)<1e-5)){
    toast('Already saved');return}
  S.saved.unshift({name:S.destName,lat:S.dest.lat,lng:S.dest.lng});
  await put('places',S.saved);renderSaved();toast('Saved');
}
async function saveHere(){
  if(!S.me){locate(true);toast('Getting your location…');return}
  const n=prompt('Name this place');if(!n)return;
  S.saved.unshift({name:n,lat:S.me.lat,lng:S.me.lng});
  await put('places',S.saved);renderSaved();toast('Saved');
}
function goSaved(i){const s=S.saved[i];setDest(s.lat,s.lng,s.name)}
async function delSaved(i){S.saved.splice(i,1);await put('places',S.saved);renderSaved()}
async function hideTip(){S.tipDone=true;await put('tipDone',true);renderSaved()}
const standalone=()=>window.navigator.standalone===true
  ||window.matchMedia('(display-mode: standalone)').matches;

function renderSaved(){
  let h=hotelCard();
  if(!standalone()&&!S.tipDone){
    h+=`<div class="tip">${ico('share')}<div class="m"><b>Add it to your home screen</b>
      <p>Tap Share in Safari, then <b>Add to Home Screen</b>. Opens fullscreen with no browser bars.</p></div>
      <button class="del" onclick="hideTip()">${ico('x','s')}</button></div>`;
  }
  h+=`<div class="hdr"><h3>OMNY weekly cap</h3></div>`+capCard();
  h+=`<button class="btn ghost sm" onclick="saveHere()">${ico('pin','s')}Save where I am now</button>
      <div class="hdr"><h3>Saved places</h3></div>`;
  if(!S.saved.length){
    h+=`<div class="empty">${ico('star')}<b>Nothing saved yet</b>
      <p>Save spots you'll return to — a restaurant, a meeting point, wherever you left something.</p></div>`;
  }else{
    S.saved.forEach((s,i)=>{h+=`<div class="sv">
      <button class="go" onclick="goSaved(${i})"><span class="pico">${ico('pin','s')}</span>
      <span class="m"><b>${s.name}</b><em>${s.lat.toFixed(4)}, ${s.lng.toFixed(4)}</em></span></button>
      <button class="del" onclick="delSaved(${i})">${ico('x','s')}</button></div>`});
  }
  h+=`<div class="note">Everything here stays on this device — everyone you share the link with keeps their own list and their own fare count.</div>`;
  $('p-save').innerHTML=h;
}

/* ── SHEET ── */
const sh=$('sheet');
function snap(st){
  S.state=st;
  document.body.classList.toggle('peek',st==='peek');
  document.documentElement.style.setProperty('--sh',
    st==='peek'?'calc(74px + env(safe-area-inset-bottom))'
    :st==='full'?'calc(100% - var(--topgap))':'50vh');
  if(st==='peek')renderPeek();
}
$('peek').onclick=()=>snap('mid');
function setTab(n){
  S.tab=n;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.p===n));
  document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id==='p-'+n));
  $('body').scrollTop=0;
  if(S.state==='peek')snap('mid');
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>setTab(t.dataset.p));
let dy=null,dh=0,moved=false;
const g=$('grab');
g.addEventListener('touchstart',e=>{dy=e.touches[0].clientY;dh=sh.offsetHeight;moved=false;
  sh.style.transition='none'},{passive:true});
g.addEventListener('touchmove',e=>{if(dy===null)return;moved=true;
  sh.style.height=Math.min(innerHeight-126,Math.max(70,dh+(dy-e.touches[0].clientY)))+'px'},{passive:true});
g.addEventListener('touchend',()=>{
  sh.style.transition='';const px=sh.offsetHeight;sh.style.height='';
  if(!moved){snap(S.state==='full'?'mid':S.state==='mid'?'peek':'mid');dy=null;return}
  const v=innerHeight;
  snap(px>v*.68?'full':px<v*.26?'peek':'mid');dy=null;
},{passive:true});

Object.assign(window,{locate,goHotel,fetchNearby,setOrigin,clearDest,saveDest,saveHere,
  goSaved,delSaved,addTap,undoTap,hideTip,selectStation,routeToStation,
  focusStation,clearFocus,routeToFocus,toggleCity});

/* ── BOOT ── */
(async function boot(){
  initMap();renderTrip();snap('mid');
  $('p-near').innerHTML=hotelCard()+'<div class="skel"></div><div class="skel"></div>';
  S.saved=await get('places',[]);
  S.taps=await get('taps',[]);
  S.tipDone=await get('tipDone',false);
  renderSaved();
  fetchNearby();locate(false);autoCompass();
  setInterval(()=>{if(S.tab==='near'||S.state==='peek')fetchNearby()},45000);
  setInterval(()=>{if(S.state==='peek')renderPeek()},15000);
})();
</script>
