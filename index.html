<link href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<style>
:root{
  --bg:#0B0C0E; --surface:#16181C; --surface2:#1E2126;
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.17);
  --fg:#F2F4F6; --fg2:#9BA3AD; --fg3:#666E78;
  --led:#FFB000; --blue:#3B82F6; --red:#EF4444; --green:#34D399; --r:12px;
  --peek:76px; --mid:52vh; --full:88vh;
  --sh:var(--mid);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;
  font-size:15px;line-height:1.45}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
svg{display:block;flex:0 0 auto}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.ic.s{width:16px;height:16px;stroke-width:2.1}

#lock{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;
  flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center}
#lock .disc{width:72px;height:72px;border-radius:50%;background:var(--led);color:#000;
  display:flex;align-items:center;justify-content:center;font-size:31px;font-weight:700;
  letter-spacing:-.05em;margin-bottom:20px}
#lock h1{font-size:24px;font-weight:700;letter-spacing:-.035em;margin:0 0 5px}
#lock p{font-size:13.5px;color:var(--fg2);margin:0 0 26px;max-width:270px}
#pw{width:100%;max-width:280px;height:52px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);padding:0 16px;text-align:center;
  letter-spacing:.3em;outline:none;margin-bottom:10px}
#pw:focus{border-color:var(--led)}
#pwgo{width:100%;max-width:280px;height:52px;background:var(--led);color:#000;
  border-radius:var(--r);font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
#pwerr{color:var(--red);font-size:12.5px;height:18px;margin-top:12px}

#app{display:none;height:100%}
#map{position:absolute;inset:0}
.maplibregl-ctrl-attrib{font-size:9px!important;opacity:.35}
.maplibregl-ctrl-bottom-left{display:none}

#topbar{position:absolute;top:0;left:0;right:0;z-index:40;
  padding:calc(env(safe-area-inset-top) + 10px) 12px 14px;
  background:linear-gradient(180deg,rgba(11,12,14,.95) 50%,rgba(11,12,14,0));pointer-events:none}
#topbar>*{pointer-events:auto}
.search{display:flex;align-items:center;gap:10px;height:50px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);padding:0 14px;
  box-shadow:0 4px 18px rgba(0,0,0,.45)}
.search:focus-within{border-color:var(--line2)}
.search>.ic{color:var(--fg3)}
#q{flex:1;min-width:0;background:none;border:0;outline:none;padding:0;letter-spacing:-.01em}
#q::placeholder{color:var(--fg3)}
#qx{display:none;color:var(--fg2);padding:5px;margin:-5px}
#results{margin-top:8px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden;display:none;max-height:50vh;overflow-y:auto;
  box-shadow:0 8px 28px rgba(0,0,0,.55)}
.res{display:flex;align-items:center;gap:12px;padding:13px 14px;
  border-bottom:1px solid var(--line);min-height:56px}
.res:last-child{border-bottom:0}
.res:active{background:var(--surface2)}
.res .ic{color:var(--fg3)}
.res .t{min-width:0;flex:1}
.res b{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res span{display:block;font-size:12px;color:var(--fg2);margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.fabs{position:absolute;right:12px;bottom:calc(var(--sh) + 12px);z-index:35;
  display:flex;flex-direction:column;gap:9px;transition:bottom .32s cubic-bezier(.32,.72,0,1)}
.fab{width:46px;height:46px;border-radius:50%;background:var(--surface);
  border:1px solid var(--line);color:var(--fg);display:flex;align-items:center;
  justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,.5)}
.fab:active{background:var(--surface2)}
.fab.on{background:var(--led);color:#000;border-color:var(--led)}

#sheet{position:absolute;left:0;right:0;bottom:0;z-index:38;height:var(--sh);
  background:var(--bg);border-top:1px solid var(--line);border-radius:18px 18px 0 0;
  display:flex;flex-direction:column;box-shadow:0 -14px 44px rgba(0,0,0,.65);
  transition:height .32s cubic-bezier(.32,.72,0,1)}
#grab{padding:9px 0 5px;display:flex;justify-content:center;flex:0 0 auto;touch-action:none}
#grab i{width:36px;height:4px;border-radius:2px;background:#3A4048;display:block}

/* peek strip — visible only when collapsed */
#peek{display:none;align-items:center;gap:11px;padding:2px 16px 0;height:44px;width:100%}
body.peek #peek{display:flex}
body.peek #tabs,body.peek #body{display:none}
#peek .lab{flex:1;min-width:0;text-align:left}
#peek .lab b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
#peek .lab em{font-style:normal;display:block;font-size:11px;color:var(--fg3);
  letter-spacing:.05em;text-transform:uppercase;margin-top:1px}
#peek .m{font-family:ui-monospace,"SF Mono",Menlo,monospace;color:var(--led);
  font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
#peek .m small{font-size:10px;opacity:.6;margin-left:2px}
#peek .up{color:var(--fg3)}

#tabs{display:flex;padding:0 12px;flex:0 0 auto;border-bottom:1px solid var(--line)}
.tab{flex:1;color:var(--fg3);padding:11px 0 13px;font-size:11px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;border-bottom:2px solid transparent;
  margin-bottom:-1px;transition:color .15s}
.tab.on{color:var(--fg);border-bottom-color:var(--led)}
#body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-bottom:calc(env(safe-area-inset-bottom) + 26px)}
.pane{display:none;padding:14px 14px 0}
.pane.on{display:block}

.hdr{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 2px 10px}
.hdr h3{margin:0;font-size:11px;font-weight:700;letter-spacing:.13em;
  text-transform:uppercase;color:var(--fg3)}
.hdr button{font-size:11px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--led);padding:6px;margin:-6px}

.hotel{background:linear-gradient(155deg,#132F4C,#111418);border:1px solid #1D4468;
  border-radius:var(--r);padding:15px;margin-bottom:11px}
.hotel .row1{display:flex;align-items:flex-start;gap:11px;margin-bottom:12px}
.hotel .row1 .ic{color:#7FB4E0;margin-top:1px}
.hotel .row1 b{font-size:15px;font-weight:700;letter-spacing:-.02em;line-height:1.3;display:block}
.hotel .row1 em{font-style:normal;font-size:12.5px;color:#93AFC7;display:block;margin-top:3px}
.hotel .acts{display:flex;gap:8px}
.hotel .acts>*{flex:1;height:42px;border-radius:9px;display:flex;align-items:center;
  justify-content:center;gap:7px;font-size:12.5px;font-weight:600;text-decoration:none;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);color:var(--fg)}
.hotel .acts .go{background:var(--led);border-color:var(--led);color:#000}

.lines{display:flex;flex-wrap:wrap;gap:7px;padding:0 2px 14px}

.clock{background:#000;border:1px solid #24262A;border-radius:var(--r);
  padding:12px 13px;margin-bottom:10px;transition:border-color .2s}
.clock.sel{border-color:var(--led)}
.clock .top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px}
.clock .top b{font-size:14.5px;font-weight:700;letter-spacing:-.015em}
.clock .top em{font-style:normal;font-size:10.5px;color:var(--fg3);
  letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.dirlab{font-size:9px;letter-spacing:.14em;color:#5A6068;font-weight:700;padding:7px 0 2px}
.arr{display:flex;align-items:center;gap:10px;padding:5px 0;
  font-family:ui-monospace,"SF Mono",Menlo,monospace}
.arr .m{margin-left:auto;color:var(--led);font-size:15px;font-weight:600;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;text-shadow:0 0 10px rgba(255,176,0,.3)}
.arr .m small{font-size:9.5px;opacity:.6;margin-left:2px}
.blt{width:23px;height:23px;border-radius:50%;display:inline-flex;align-items:center;
  justify-content:center;font-size:12px;font-weight:700;color:#fff;letter-spacing:-.03em;
  flex:0 0 auto;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
.blt.dark{color:#000}

.seg{display:flex;background:var(--surface);border:1px solid var(--line);

  font-weight:600;transition:background .15s,color .15s}
.seg button.on{background:var(--surface2);color:var(--fg)}

.pts{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  margin-bottom:10px;overflow:hidden}
.pt{display:flex;align-items:center;gap:12px;padding:13px 14px;min-height:54px}
.pt+.pt{border-top:1px solid var(--line)}
.pt .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.pt .dot.sq{border-radius:2px}
.pt .t{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.pt button{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;

.mode{display:flex;align-items:center;gap:13px;background:var(--surface);

.mode .m{flex:1;min-width:0}
.mode .m b{font-size:14.5px;font-weight:600;letter-spacing:-.01em;

.mode .n{text-align:right;flex:0 0 auto}
.mode .n b{display:block;font-size:19px;font-weight:700;letter-spacing:-.035em;
  font-variant-numeric:tabular-nums;line-height:1.15}
.mode .n span{display:block;font-size:11.5px;color:var(--fg2);font-variant-numeric:tabular-nums}
.mode.walk{border-left-color:#6CBE45} .mode.walk .ic{color:#8ED96B}
.mode.bike{border-left-color:#00933C} .mode.bike .ic{color:#3FBF6E}
.mode.train{border-left-color:#0039A6} .mode.train .ic{color:#5B93E8}
.mode.taxi{border-left-color:#FCCC0A} .mode.taxi .ic{color:#FCCC0A}

/* fare cap */
.cap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:15px;margin-bottom:11px}
.cap .row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:4px}
.cap .row b{font-size:22px;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.cap .row em{font-style:normal;font-size:11.5px;color:var(--fg2);text-align:right}
.cap .bar{height:7px;border-radius:99px;background:#24272C;overflow:hidden;margin:11px 0 9px}
.cap .bar i{display:block;height:100%;border-radius:99px;background:var(--led);
  transition:width .4s cubic-bezier(.32,.72,0,1)}
.cap.done .bar i{background:var(--green)}
.cap .sub{font-size:12px;color:var(--fg2);margin-bottom:13px}
.cap .sub b{color:var(--green)}
.cap .btns{display:flex;gap:8px}
.cap .btns button{flex:1;height:42px;border-radius:9px;background:var(--surface2);
  border:1px solid var(--line);font-size:12.5px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:6px}
.cap .btns .add{background:var(--led);border-color:var(--led);color:#000;flex:2}
.cap .btns button:active{opacity:.78}

.btn{width:100%;height:50px;border-radius:var(--r);background:var(--led);color:#000;
  font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px}
.btn:active{opacity:.82}
.btn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.btn.sm{height:44px;font-size:12px}
.trio{display:flex;gap:8px;margin-bottom:12px}
.trio a{flex:1;text-decoration:none}
.trio .btn{margin:0}

.sv{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);margin-bottom:9px;padding:0 6px 0 14px;min-height:58px}
.sv .go{flex:1;display:flex;align-items:center;gap:12px;min-width:0;padding:12px 0;text-align:left}
.sv .go .ic{color:var(--fg2)}
.sv .m{min-width:0;flex:1}
.sv .m b{display:block;font-size:14px;font-weight:600;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.sv .m em{font-style:normal;display:block;font-size:11.5px;color:var(--fg3);margin-top:1px}
.sv .del{width:40px;height:40px;display:flex;align-items:center;justify-content:center;
  color:var(--fg3);border-radius:50%;flex:0 0 auto}
.sv .del:active{background:var(--surface2)}

.tip{background:var(--surface2);border:1px solid var(--line2);border-radius:var(--r);
  padding:14px;margin-bottom:11px;display:flex;gap:12px;align-items:flex-start}
.tip .ic{color:var(--led);margin-top:1px}
.tip .m{flex:1;min-width:0}
.tip .m b{display:block;font-size:13.5px;font-weight:600;margin-bottom:3px}
.tip .m p{margin:0;font-size:12.5px;color:var(--fg2);line-height:1.5}
.tip .del{color:var(--fg3);padding:4px;margin:-4px}

.note{font-size:11.5px;color:var(--fg3);line-height:1.55;padding:2px 3px 18px}
.warn{background:#2A1618;border:1px solid #4E2529;border-radius:var(--r);
  padding:13px 14px;margin-bottom:10px}
.warn b{display:block;font-size:13.5px;margin-bottom:4px}
.warn p{margin:0;font-size:12.5px;color:#D8A8AA;line-height:1.5}
.empty{text-align:center;padding:28px 20px 24px}
.empty .ic{width:30px;height:30px;color:var(--fg3);margin:0 auto 12px;stroke-width:1.5}
.empty b{display:block;font-size:15px;font-weight:600;margin-bottom:5px}
.empty p{margin:0 auto;font-size:12.5px;color:var(--fg2);max-width:250px;line-height:1.55}
.skel{height:78px;background:linear-gradient(90deg,var(--surface),var(--surface2),var(--surface));
  background-size:200% 100%;border-radius:var(--r);margin-bottom:10px;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-200% 0}}

#toast{position:absolute;left:50%;bottom:calc(var(--sh) + 20px);transform:translate(-50%,14px);
  z-index:60;background:var(--surface2);border:1px solid var(--line2);border-radius:99px;
  padding:11px 18px;font-size:13px;box-shadow:0 6px 22px rgba(0,0,0,.6);opacity:0;
  pointer-events:none;transition:opacity .22s,transform .22s,bottom .32s;
  white-space:nowrap;max-width:88vw;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1;transform:translate(-50%,0)}

.mk{cursor:pointer}
.mk-stn{width:24px;height:24px;border-radius:50%;background:#0B0C0E;border:2px solid #fff;
  display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.6);
  transition:transform .15s}
.mk-stn i{width:9px;height:9px;border-radius:50%;background:var(--led);display:block}
.mk-stn.sel{border-color:var(--led);transform:scale(1.2)}
.mk-me{width:17px;height:17px;border-radius:50%;background:var(--blue);border:2.5px solid #fff;
  box-shadow:0 0 0 6px rgba(59,130,246,.2),0 2px 7px rgba(0,0,0,.5)}
.mk-pin{width:16px;height:16px;border-radius:50% 50% 50% 2px;transform:rotate(45deg);
  border:2.5px solid #fff;box-shadow:0 3px 9px rgba(0,0,0,.6)}
.mk-pin.dest{background:var(--red)}
.mk-pin.hotel{background:var(--blue)}
.mk-ent{width:16px;height:16px;border-radius:50%;background:var(--surface2);
  border:2px solid #fff;display:flex;align-items:center;justify-content:center;
  font-size:8px;font-weight:800;color:#0B0C0E;box-shadow:0 2px 6px rgba(0,0,0,.55)}
.mk-ent.acc{background:var(--green)}
.entline{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--fg2);
  padding:2px 0 8px}
.entline .dot{width:14px;height:14px;border-radius:50%;background:var(--surface2);
  border:1.5px solid var(--fg3);display:flex;align-items:center;justify-content:center;
  font-size:7px;font-weight:800;color:var(--fg2);flex:0 0 auto}
.entline .dot.acc{background:var(--green);border-color:var(--green);color:#06231A}
.entline b{color:var(--fg)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<body>

<div id="lock">
  <div class="disc">N</div>
  <h1>NYC Navigator</h1>
  <p>Enter the code to open the map.</p>
  <input id="pw" type="password" placeholder="• • • • • •" autocomplete="off" enterkeyhint="go">
  <button id="pwgo">Unlock</button>
  <div id="pwerr"></div>
</div>

<div id="app">
  <div id="map"></div>

  <div id="topbar">
    <div class="search">
      <svg class="ic s" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.2-4.2"/></svg>
      <input id="q" placeholder="Search a place or address" autocomplete="off" enterkeyhint="search">
      <button id="qx"><svg class="ic s" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div id="results"></div>
  </div>

  <div class="fabs" id="fabs">
    <button class="fab" id="fPin" aria-label="Drop a pin at map centre">
      <svg class="ic" viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.4"/></svg>
    </button>
    <button class="fab" id="fLoc" aria-label="Recenter on me">
      <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.4"/><circle cx="12" cy="12" r="8"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/></svg>
    </button>
  </div>

  <div id="toast"></div>

  <div id="sheet">
    <div id="grab"><i></i></div>
    <button id="peek">
      <span id="peekBlt"></span>
      <span class="lab"><b id="peekName">Loading nearby trains…</b><em id="peekDir"></em></span>
      <span class="m" id="peekMin"></span>
      <svg class="ic s up" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>
    </button>
    <div id="tabs">
      <button class="tab on" data-p="near">Nearby</button>
      <button class="tab" data-p="trip">Trip</button>
      <button class="tab" data-p="save">Places</button>
    </div>
    <div id="body">
      <div class="pane on" id="p-near"></div>
      <div class="pane" id="p-trip"></div>
      <div class="pane" id="p-save"></div>
    </div>
  </div>
</div>

<script>
/* ═════════ NYC NAVIGATOR ═════════ */
const PASSWORD='stone8';

const HOTEL={name:'DoubleTree by Hilton New York Downtown',short:'Hotel',
  lat:40.703921,lng:-74.0123541,addr:'8 Stone Street, Financial District',
  phone:'+12124809100',stay:'Aug 1–5 · Check-out 11:00 AM'};

const FARE=3.00, CAP=35.00;

const LINES={'1':'#EE352E','2':'#EE352E','3':'#EE352E','4':'#00933C','5':'#00933C',
'5X':'#00933C','6':'#00933C','6X':'#00933C','7':'#B933AD','7X':'#B933AD','A':'#0039A6',
'C':'#0039A6','E':'#0039A6','B':'#FF6319','D':'#FF6319','F':'#FF6319','FX':'#FF6319',
'M':'#FF6319','G':'#6CBE45','J':'#996633','Z':'#996633','L':'#A7A9AC','N':'#FCCC0A',
'Q':'#FCCC0A','R':'#FCCC0A','W':'#FCCC0A','S':'#808183','H':'#808183','FS':'#808183',
'GS':'#808183','SI':'#0039A6','SIR':'#0039A6'};
const DARK=['N','Q','R','W'];

const I={
walk:'<circle cx="13.2" cy="4.6" r="1.7"/><path d="M9 21l2.2-5.4L9.4 12.4V9.2l3.2-1.6 2.6 2.2 2.8 1.4"/><path d="M11.2 15.6 9.6 21M13.8 13l1.9 3 .6 5"/>',
bike:'<circle cx="5.6" cy="16.8" r="3.5"/><circle cx="18.4" cy="16.8" r="3.5"/><path d="M9 16.8l3.6-7 3 4h2.8M14.4 6.3h2.4"/>',
train:'<rect x="5.2" y="3" width="13.6" height="13" rx="3.2"/><path d="M5.2 11h13.6M9 16.4l-2.2 2.6M15 16.4l2.2 2.6M9.6 13.6h4.8"/><circle cx="8.8" cy="7" r=".7" fill="currentColor" stroke="none"/><circle cx="15.2" cy="7" r=".7" fill="currentColor" stroke="none"/>',
taxi:'<path d="M4 16.4h16v-4l-1.8-4.2A2 2 0 0 0 16.4 7H7.6a2 2 0 0 0-1.8 1.2L4 12.4z"/><circle cx="7.6" cy="16.4" r="1.9"/><circle cx="16.4" cy="16.4" r="1.9"/><path d="M9.6 7V4.6h4.8V7"/>',
hotel:'<path d="M3.2 21V6.6L12 3.1l8.8 3.5V21"/><path d="M2.2 21h19.6M9.6 21v-4.6h4.8V21"/><path d="M7.8 10h1.6M14.6 10h1.6M7.8 13.4h1.6M14.6 13.4h1.6"/>',
pin:'<path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.4"/>',
phone:'<path d="M5 3.6h3.1l1.6 4-2 1.4a12 12 0 0 0 5.3 5.3l1.4-2 4 1.6v3.2a2.4 2.4 0 0 1-2.6 2.4A15.6 15.6 0 0 1 2.6 6.2 2.4 2.4 0 0 1 5 3.6z"/>',
x:'<path d="M18 6 6 18M6 6l12 12"/>',
plus:'<path d="M12 5v14M5 12h14"/>',
star:'<path d="M12 3.6l2.5 5.2 5.5.8-4 3.9 1 5.6-5-2.7-5 2.7 1-5.6-4-3.9 5.5-.8z"/>',
route:'<circle cx="6" cy="6" r="2.6"/><circle cx="18" cy="18" r="2.6"/><path d="M8.6 6H14a3.4 3.4 0 0 1 0 6.8h-4a3.4 3.4 0 0 0 0 6.8h5.4"/>',
card:'<rect x="2.6" y="5" width="18.8" height="14" rx="2.6"/><path d="M2.6 9.6h18.8M6.4 14.6h3.2"/>',
share:'<path d="M12 15.5V3.4M8.4 7 12 3.4 15.6 7"/><path d="M6 11.5H4.6v8.4A1.6 1.6 0 0 0 6.2 21.5h11.6a1.6 1.6 0 0 0 1.6-1.6v-8.4H18"/>',
search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4.2-4.2"/>'};
const ico=(k,c)=>`<svg class="ic ${c||''}" viewBox="0 0 24 24">${I[k]}</svg>`;
const $=i=>document.getElementById(i);

const S={me:null,dest:null,destName:'',origin:'me',stations:[],saved:[],taps:[],
  markers:[],meMk:null,destMk:null,selStn:null,trip:null,tab:'near',busy:false,
  state:'mid',tipDone:false,ent:{},entMk:[]};

/* ── LOCK ── */
function unlock(){
  if($('pw').value.trim().toLowerCase()===PASSWORD.toLowerCase()){
    try{sessionStorage.setItem('nn','1')}catch(e){}
    $('lock').style.display='none';$('app').style.display='block';boot();
  }else{$('pwerr').textContent='Wrong code';$('pw').value='';$('pw').focus()}
}
$('pwgo').onclick=unlock;
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
try{if(sessionStorage.getItem('nn')==='1'){
  $('lock').style.display='none';$('app').style.display='block';setTimeout(()=>boot(),0)}}catch(e){}

let tT;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');
  clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),2600)}

/* ── MAP ── */
let map,mapOK=false,booted=false;
function initMap(){
  map=new maplibregl.Map({container:'map',
    style:'https://tiles.openfreemap.org/styles/liberty',
    center:[HOTEL.lng,HOTEL.lat],zoom:14.4,attributionControl:{compact:true}});
  map.on('load',ready);
  map.on('error',()=>{if(!mapOK)fallback()});
  setTimeout(()=>{if(!mapOK)fallback()},8000);
}
function fallback(){
  if(mapOK||!map)return;
  try{map.setStyle({version:8,sources:{o:{type:'raster',
    tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,
    attribution:'© OpenStreetMap'}},layers:[{id:'o',type:'raster',source:'o'}]});
    map.once('styledata',ready)}catch(e){}
}
function ready(){
  if(mapOK)return;mapOK=true;
  routeLayer();
  mk(HOTEL.lng,HOTEL.lat,'<div class="mk-pin hotel"></div>',()=>toast(HOTEL.name));
  if(S.me)S.meMk=mk(S.me.lng,S.me.lat,'<div class="mk-me"></div>');
  if(S.dest)placeDest();
  if(S.stations.length)plotStations();
  longPress();
  map.on('click',()=>{
    $('results').style.display='none';$('q').blur();
    if(S.selStn!==null){S.selStn=null;renderNearby();plotStations();plotEntrances(null)}
  });
}
function routeLayer(){
  if(map.getSource('rt'))return;
  map.addSource('rt',{type:'geojson',data:fc([])});
  map.addLayer({id:'rtg',type:'line',source:'rt',layout:{'line-cap':'round','line-join':'round'},
    paint:{'line-color':'#FFB000','line-width':11,'line-opacity':.16,'line-blur':5}});
  map.addLayer({id:'rtl',type:'line',source:'rt',layout:{'line-cap':'round','line-join':'round'},
    paint:{'line-color':'#FFB000','line-width':4}});
}
const fc=f=>({type:'FeatureCollection',features:f});
function drawRoute(c){
  if(!mapOK)return;routeLayer();
  map.getSource('rt').setData(c&&c.length
    ?fc([{type:'Feature',geometry:{type:'LineString',coordinates:c},properties:{}}]):fc([]));
}
function mk(lng,lat,html,tap){
  const el=document.createElement('div');el.className='mk';el.innerHTML=html;
  if(tap)el.addEventListener('click',e=>{e.stopPropagation();tap()});
  return new maplibregl.Marker({element:el}).setLngLat([lng,lat]).addTo(map);
}
function longPress(){
  const c=map.getCanvas();let tm=null,sx=0,sy=0,ll=null;
  const rel=p=>{const r=c.getBoundingClientRect();return[p.clientX-r.left,p.clientY-r.top]};
  const go=(x,y,pt)=>{sx=x;sy=y;ll=pt;tm=setTimeout(()=>{tm=null;
    if(navigator.vibrate)try{navigator.vibrate(18)}catch(e){}
    setDest(ll.lat,ll.lng,'Dropped pin');toast('Pin dropped')},520)};
  const mv=(x,y)=>{if(tm&&(Math.abs(x-sx)>12||Math.abs(y-sy)>12)){clearTimeout(tm);tm=null}};
  const end=()=>{if(tm){clearTimeout(tm);tm=null}};
  c.addEventListener('touchstart',e=>{if(e.touches.length!==1)return end();
    const t=e.touches[0];go(t.clientX,t.clientY,map.unproject(rel(t)))},{passive:true});
  c.addEventListener('touchmove',e=>{const t=e.touches[0];mv(t.clientX,t.clientY)},{passive:true});
  c.addEventListener('touchend',end,{passive:true});
  c.addEventListener('touchcancel',end,{passive:true});
  c.addEventListener('mousedown',e=>go(e.clientX,e.clientY,map.unproject(rel(e))));
  c.addEventListener('mousemove',e=>mv(e.clientX,e.clientY));
  c.addEventListener('mouseup',end);
}

/* ── STORAGE ── */
async function get(k,def){
  try{const r=await window.storage.get('nn:'+k);return r?JSON.parse(r.value):def}
  catch(e){try{const v=localStorage.getItem('nn:'+k);return v?JSON.parse(v):def}catch(e2){return def}}
}
async function put(k,v){
  const s=JSON.stringify(v);
  try{await window.storage.set('nn:'+k,s)}catch(e){try{localStorage.setItem('nn:'+k,s)}catch(e2){}}
}
async function loadAll(){
  S.saved=await get('places',[]);

/* ── LOCATION ── */
let lw=null;
function locate(recenter){
  if(!navigator.geolocation){toast("This browser can't share location");return}
  $('fLoc').classList.add('on');
  if(lw!==null)navigator.geolocation.clearWatch(lw);
  lw=navigator.geolocation.watchPosition(p=>{
    const first=!S.me;
    S.me={lat:p.coords.latitude,lng:p.coords.longitude};
    if(S.meMk)S.meMk.setLngLat([S.me.lng,S.me.lat]);
    else if(mapOK)S.meMk=mk(S.me.lng,S.me.lat,'<div class="mk-me"></div>');
    if((first||recenter)&&mapOK)map.easeTo({center:[S.me.lng,S.me.lat],zoom:15.4});
    if(first){fetchNearby();if(S.dest)plan();else renderTrip()}
  },err=>{
    $('fLoc').classList.remove('on');
    toast(err.code===1?'Location blocked — check Safari settings':'No GPS fix yet');
    if(S.tab==='near'&&!S.stations.length)fetchNearby();
  },{enableHighAccuracy:true,timeout:12000,maximumAge:20000});
}
const from=()=>S.origin==='hotel'
  ?{lat:HOTEL.lat,lng:HOTEL.lng,label:'DoubleTree Downtown'}
  :(S.me?{lat:S.me.lat,lng:S.me.lng,label:'Your location'}:null);

/* ── ARRIVALS ── */
const RELAYS=[u=>u,
  u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),
  u=>'https://corsproxy.io/?url='+encodeURIComponent(u),
  u=>'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(u)];

async function fetchNearby(){
  const at=S.me||{lat:HOTEL.lat,lng:HOTEL.lng};
  if(!S.stations.length)$('p-near').innerHTML=hotelCard()+'<div class="skel"></div><div class="skel"></div>';
  const base=`https://api.wheresthefuckingtrain.com/by-location?lat=${at.lat}&lon=${at.lng}`;
  let why='no response';
  for(const w of RELAYS){
    try{
      const c=new AbortController(),t=setTimeout(()=>c.abort(),8000);
      let r;try{r=await fetch(w(base),{signal:c.signal})}finally{clearTimeout(t)}
      if(!r.ok){why='HTTP '+r.status;continue}
      const j=await r.json();
      if(!j||!Array.isArray(j.data)){why='unexpected data';continue}
      S.stations=j.data;renderNearby();plotStations();renderPeek();
      loadEntrancesForVisible();return;
    }catch(e){why=e.name==='AbortError'?'timed out'
      :/fetch|network|load failed/i.test(e.message||'')?'blocked by browser':(e.message||'failed')}
  }
  $('p-near').innerHTML=hotelCard()+
   `<div class="warn"><b>Live arrivals unavailable</b>
    <p>Tried four routes to the MTA feed, all failed (${why}). Everything else still works.</p></div>
    <button class="btn ghost sm" onclick="fetchNearby()">Retry</button>`;
}
/* ── ENTRANCES (MTA Subway Entrances & Exits, NY Open Data) ── */
const ENT_TYPE_LABEL={Stair:'Stairs',Escalator:'Escalator',Elevator:'Elevator',
  'Station House':'Station house','Easement - Street':'Street-level',
  'Easement - Passage':'Passage',Ramp:'Ramp',Door:'Door'};
const ENT_LETTER={Stair:'S',Escalator:'E',Elevator:'L','Station House':'H',
  'Easement - Street':'D','Easement - Passage':'D',Ramp:'R',Door:'D'};
async function fetchEntrances(lat,lng,key){
  if(S.ent[key]!==undefined) return S.ent[key];
  S.ent[key]=null; // mark in-flight
  const url=`https://data.ny.gov/resource/i9wp-a4ja.json?$where=within_circle(entrance_georeference,${lat},${lng},350)&$limit=40`;
  try{
    const c=new AbortController(),t=setTimeout(()=>c.abort(),8000);
    let r;try{r=await fetch(url,{signal:c.signal})}finally{clearTimeout(t)}
    if(!r.ok)throw 0;
    const j=await r.json();
    const list=j.map(e=>({lat:+e.entrance_latitude,lng:+e.entrance_longitude,
      type:e.entrance_type||'Door',entry:e.entry_allowed==='YES'}))
      .filter(e=>!isNaN(e.lat)&&!isNaN(e.lng));
    S.ent[key]=list;return list;
  }catch(e){S.ent[key]=[];return[]}
}
function entKey(st){return st.name+'|'+st.location[0].toFixed(4)+','+st.location[1].toFixed(4)}
async function loadEntrancesForVisible(){
  const at=S.me||{lat:HOTEL.lat,lng:HOTEL.lng};
  await Promise.all(S.stations.slice(0,5).map(st=>
    fetchEntrances(st.location[0],st.location[1],entKey(st))));
  if(S.tab==='near') renderNearby();
}
function nearestEntranceLine(at,st){
  const list=S.ent[entKey(st)];
  if(list===undefined) return `<div class="entline">Finding entrances…</div>`;
  if(!list||!list.length) return '';
  let best=null,bd=Infinity;
  list.forEach(e=>{const d=hav(at.lat,at.lng,e.lat,e.lng);if(d<bd){bd=d;best=e}});
  if(!best) return '';
  const acc=best.type==='Elevator';
  const mins=Math.max(1,Math.round(bd*1.32/3.1*60));
  return `<div class="entline"><span class="dot${acc?' acc':''}">${ENT_LETTER[best.type]||'D'}</span>
    Nearest entrance: <b>${ENT_TYPE_LABEL[best.type]||best.type}</b> · ${mins} min walk</div>`;
}
function plotEntrances(idx){
  S.entMk.forEach(m=>m.remove());S.entMk=[];
  if(idx===null||!mapOK) return;
  const st=S.stations[idx],list=S.ent[entKey(st)];
  if(!list||!list.length) return;
  list.forEach(e=>{
    const acc=e.type==='Elevator';
    S.entMk.push(mk(e.lng,e.lat,`<div class="mk-ent${acc?' acc':''}">${ENT_LETTER[e.type]||'D'}</div>`,
      ()=>toast(`${ENT_TYPE_LABEL[e.type]||e.type}${e.entry?'':' · exit only'}`)));
  });
}
const blt=(r,sm)=>`<span class="blt${DARK.includes(r)?' dark':''}${sm?' sm':''}" style="background:${LINES[r]||'#5A6068'}">${r}</span>`;
const mins=i=>{const d=(new Date(i)-Date.now())/6e4;return d<.5?['Now','']:[String(Math.round(d)),'min']};
const wMin=(a,b,c,d)=>Math.max(1,Math.round(hav(a,b,c,d)*1.32/3.1*60));

/* soonest train across nearby stations, for the collapsed strip */
function soonest(){
  let best=null;
  S.stations.slice(0,5).forEach(st=>{
    [['N','Northbound'],['S','Southbound']].forEach(([d,lab])=>{
      (st[d]||[]).forEach(t=>{
        const s=(new Date(t.time)-Date.now())/1000;
        if(s>-30&&(!best||s<best.s)) best={s,route:t.route,station:st.name,dir:lab};
      });
    });
  });
  return best;
}
function renderPeek(){
  const b=soonest();
  if(!b){$('peekName').textContent='No live arrivals';$('peekDir').textContent='';
    $('peekBlt').innerHTML='';$('peekMin').innerHTML='';return}
  const m=Math.max(0,Math.round(b.s/60));
  $('peekBlt').innerHTML=blt(b.route);
  $('peekName').textContent=b.station;
  $('peekDir').textContent=b.dir;
  $('peekMin').innerHTML=m<1?'Now':`${m}<small>min</small>`;
}

function renderNearby(){
  const at=S.me||{lat:HOTEL.lat,lng:HOTEL.lng};
  let h=hotelCard();
  if(!S.stations.length){
    $('p-near').innerHTML=h+`<div class="empty">${ico('train')}<b>No stations found</b>
      <p>Nothing nearby, or the feed hasn't loaded yet.</p></div>`;return;
  }
  const seen=new Set();
  S.stations.slice(0,5).forEach(st=>[...(st.N||[]),...(st.S||[])].forEach(t=>seen.add(t.route)));
  if(seen.size) h+=`<div class="hdr"><h3>Lines near you</h3></div>
    <div class="lines">${[...seen].sort().map(r=>blt(r)).join('')}</div>`;
  h+=`<div class="hdr"><h3>Nearest stations</h3><button onclick="fetchNearby()">Refresh</button></div>`;
  S.stations.slice(0,5).forEach((st,i)=>{
    h+=`<div class="clock${S.selStn===i?' sel':''}" onclick="selectStation(${i})"><div class="top"><b>${st.name}</b>
      <em>${wMin(at.lat,at.lng,st.location[0],st.location[1])} min walk</em></div>
      ${nearestEntranceLine(at,st)}`;
    let any=false;
    [['N','NORTHBOUND'],['S','SOUTHBOUND']].forEach(([d,lab])=>{
      const l=(st[d]||[]).slice(0,3);if(!l.length)return;any=true;
      h+=`<div class="dirlab">${lab}</div>`;
      l.forEach(t=>{const[m,u]=mins(t.time);
        h+=`<div class="arr">${blt(t.route)}<span class="m">${m}<small>${u}</small></span></div>`});
    });
    if(!any)h+=`<div class="dirlab">No trains listed right now</div>`;
    h+=`</div>`;
  });
  h+=`<div class="note">Live MTA data, refreshing every 45 seconds. You'll have signal on the platform but usually not between stations — frozen times mid-tunnel are normal.</div>`;
  $('p-near').innerHTML=h;
}
function plotStations(){
  if(!mapOK)return;
  S.markers.forEach(m=>m.remove());S.markers=[];
  S.stations.slice(0,5).forEach((st,i)=>{
    S.markers.push(mk(st.location[1],st.location[0],

/* ── MATH + FARE ── */
function hav(a,b,c,d){const R=3958.8,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r;
  const h=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;
  return 2*R*Math.asin(Math.sqrt(h))}
function taxi(mi,min,f,t){
  let v=3+Math.ceil(mi*5)*.7+Math.max(0,min-mi*3)*.7+1.5;
  const n=new Date(),h=n.getHours(),wd=n.getDay()>0&&n.getDay()<6,tags=[];
  if(h>=20||h<6){v+=1;tags.push('overnight')}
  if(wd&&h>=16&&h<20){v+=2.5;tags.push('rush hour')}
  if(f.lat<40.786||t.lat<40.786){v+=2.5;tags.push('congestion')}
  if(f.lat<40.7648||t.lat<40.7648)v+=.75;
  return{v,tags}}
const fm=s=>s<60?'<1':String(Math.round(s/60));
async function valhalla(f,t,costing){
  const c=new AbortController(),tm=setTimeout(()=>c.abort(),9000);
  try{
    const r=await fetch('https://valhalla1.openstreetmap.de/route?json='+
      encodeURIComponent(JSON.stringify({locations:[{lat:f.lat,lon:f.lng},{lat:t.lat,lon:t.lng}],
      costing,directions_options:{units:'miles'}})),{signal:c.signal});
    if(!r.ok)throw 0;
    const j=await r.json();
    if(!j.trip||!j.trip.summary)throw 0;
    return{sec:j.trip.summary.time,mi:j.trip.summary.length,
      shape:(j.trip.legs||[]).map(l=>l.shape).filter(Boolean)};
  }finally{clearTimeout(tm)}
}
const guess=(f,t,mph)=>{const mi=hav(f.lat,f.lng,t.lat,t.lng)*1.32;
  return{sec:mi/mph*3600,mi,shape:null,est:true}};
function poly(s){let i=0,la=0,ln=0,o=[],sh,re,by;
  while(i<s.length){sh=0;re=0;
    do{by=s.charCodeAt(i++)-63;re|=(by&31)<<sh;sh+=5}while(by>=32);
    la+=(re&1)?~(re>>1):(re>>1);sh=0;re=0;
    do{by=s.charCodeAt(i++)-63;re|=(by&31)<<sh;sh+=5}while(by>=32);
    ln+=(re&1)?~(re>>1):(re>>1);o.push([ln/1e6,la/1e6])}
  return o}

async function plan(){
  if(!S.dest||!from()){renderTrip();return}
  const f=from();
  S.busy=true;renderTrip();
  const crow=hav(f.lat,f.lng,S.dest.lat,S.dest.lng);
  const[w,b,c]=await Promise.all([
    valhalla(f,S.dest,'pedestrian').catch(()=>guess(f,S.dest,3.1)),
    valhalla(f,S.dest,'bicycle').catch(()=>guess(f,S.dest,9.5)),
    valhalla(f,S.dest,'auto').catch(()=>guess(f,S.dest,11))]);
  let tr=null;
  if(S.stations.length&&crow>.55){
    const st=S.stations[0];
    const toStn=hav(f.lat,f.lng,st.location[0],st.location[1])*1.32/3.1*3600;
    const nx=[...(st.N||[]),...(st.S||[])]
      .map(t=>({r:t.route,s:(new Date(t.time)-Date.now())/1000}))
      .filter(t=>t.s>60).sort((a,b)=>a.s-b.s)[0];
    const wait=nx?nx.s:300;
    tr={sec:toStn+wait+crow/17*3600+360,station:st.name,route:nx?nx.r:null,wait:Math.round(wait/60)};
  }
  S.trip={w,b,c,tr,fare:taxi(c.mi,c.sec/60,f,S.dest),f};
  const co=w.shape&&w.shape.length?w.shape.flatMap(poly):null;
  drawRoute(co);
  if(co&&co.length&&mapOK)try{
    map.fitBounds(co.reduce((x,p)=>x.extend(p),new maplibregl.LngLatBounds(co[0],co[0])),
      {padding:{top:120,bottom:Math.round(innerHeight*.55),left:46,right:46}})}catch(e){}
  S.busy=false;renderTrip();
}

    <div class="note">Taxi fare uses the TLC meter formula — $3.00 initial, $0.70 per ⅕ mile, plus whichever surcharges apply right now. Tolls and tip not included. Subway time assumes a 17 mph average with stops.</div>`;
  $('p-trip').innerHTML=h;
}

/* ── OMNY FARE CAP ── */
function taps7(){
  const cut=Date.now()-7*864e5;
  return S.taps.filter(t=>t>cut);
}
async function addTap(){
  const t=taps7();
  if(t.length&&Date.now()-Math.max(...t)<9e5){ toast('Taps under 15 min apart don\'t count'); return; }
  S.taps=[...t,Date.now()];await put('taps',S.taps);renderSaved();
  const spent=Math.min(CAP,S.taps.length*FARE);
  toast(spent>=CAP?'Capped — rides are free now':`$${spent.toFixed(2)} of $${CAP} this week`);
}
async function undoTap(){
  const t=taps7();if(!t.length){toast('Nothing to undo');return}
  t.sort((a,b)=>a-b);t.pop();S.taps=t;await put('taps',S.taps);renderSaved();toast('Removed');
}
function capCard(){
  const t=taps7(),spent=Math.min(CAP,t.length*FARE),done=spent>=CAP;
  const pct=Math.min(100,spent/CAP*100);
  const left=Math.max(0,Math.ceil((CAP-spent)/FARE));
  const next=t.length?new Date(Math.min(...t)+7*864e5):null;
  return `<div class="cap${done?' done':''}">
    <div class="row"><b>$${spent.toFixed(2)} <span style="font-size:13px;color:var(--fg3);font-weight:500">of $${CAP.toFixed(0)}</span></b>
      <em>${t.length} ride${t.length===1?'':'s'}<br>this 7 days</em></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="sub">${done
      ? `<b>Capped — every ride is free</b> until ${next?next.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}):'the window rolls'}.`
      : `${left} more paid ride${left===1?'':'s'} and the rest of the week is free.`}</div>
    <div class="btns">
      <button class="add" onclick="addTap()">${ico('plus','s')}I tapped in</button>
      <button onclick="undoTap()">Undo</button></div></div>`;
}

/* ── PLACES ── */
async function saveDest(){
  if(!S.dest)return;
  if(S.saved.some(s=>Math.abs(s.lat-S.dest.lat)<1e-5&&Math.abs(s.lng-S.dest.lng)<1e-5)){
    toast('Already saved');return}
  S.saved.unshift({name:S.destName,lat:S.dest.lat,lng:S.dest.lng});
  await put('places',S.saved);renderSaved();toast('Saved to Places');
}
async function saveHere(){
  if(!S.me){locate(true);toast('Getting your location…');return}
  const n=prompt('Name this place');if(!n)return;
  S.saved.unshift({name:n,lat:S.me.lat,lng:S.me.lng});
  await put('places',S.saved);renderSaved();toast('Saved');
}
function goSaved(i){const s=S.saved[i];setDest(s.lat,s.lng,s.name)}
async function delSaved(i){S.saved.splice(i,1);await put('places',S.saved);renderSaved()}
async function hideTip(){S.tipDone=true;await put('tipDone',true);renderSaved()}

const standalone=()=>window.navigator.standalone===true
  ||window.matchMedia('(display-mode: standalone)').matches;

function renderSaved(){
  let h=hotelCard();
  if(!standalone()&&!S.tipDone){
    h+=`<div class="tip">${ico('share')}<div class="m"><b>Run it like a real app</b>
      <p>Tap Share in Safari, then <b>Add to Home Screen</b>. Opens fullscreen with no browser bars.</p></div>
      <button class="del" onclick="hideTip()">${ico('x','s')}</button></div>`;
  }
  h+=`<div class="hdr"><h3>${ico('card','s')}&nbsp;OMNY weekly cap</h3></div>`+capCard();
  h+=`<button class="btn ghost sm" onclick="saveHere()">${ico('pin','s')}Save where I am now</button>
      <div class="hdr"><h3>Saved places</h3></div>`;
  if(!S.saved.length){
    h+=`<div class="empty">${ico('star')}<b>Nothing saved yet</b>
      <p>Save the spots you'll return to — a restaurant, a meeting point, wherever you left something.</p></div>`;
  }else{
    S.saved.forEach((s,i)=>{h+=`<div class="sv">
      <button class="go" onclick="goSaved(${i})">${ico('pin')}<span class="m"><b>${s.name}</b>
      <em>${s.lat.toFixed(4)}, ${s.lng.toFixed(4)}</em></span></button>
      <button class="del" onclick="delSaved(${i})">${ico('x','s')}</button></div>`});
  }
  h+=`<div class="note">Everything here stays on this device — everyone you share the link with keeps their own list and their own fare count.</div>`;
  $('p-save').innerHTML=h;
}

/* ── SHEET ── */
const sh=$('sheet');
const H=()=>({peek:76,mid:innerHeight*.52,full:innerHeight*.88});
function snap(st){
  S.state=st;
  document.body.classList.toggle('peek',st==='peek');
  const px=st==='peek'?'76px':st==='full'?'88vh':'52vh';
  document.documentElement.style.setProperty('--sh',px);
  if(st==='peek')renderPeek();
}
$('peek').onclick=()=>snap('mid');
function setTab(n){
  S.tab=n;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.p===n));
  document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id==='p-'+n));
  $('body').scrollTop=0;
  if(S.state==='peek')snap('mid');
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>setTab(t.dataset.p));
let dy=null,dh=0,moved=false;
const g=$('grab');
g.addEventListener('touchstart',e=>{dy=e.touches[0].clientY;dh=sh.offsetHeight;moved=false;
  sh.style.transition='none'},{passive:true});
g.addEventListener('touchmove',e=>{if(dy===null)return;moved=true;
  sh.style.height=Math.min(innerHeight*.9,Math.max(70,dh+(dy-e.touches[0].clientY)))+'px'},{passive:true});
g.addEventListener('touchend',()=>{
  sh.style.transition='';const px=sh.offsetHeight;sh.style.height='';
  if(!moved){snap(S.state==='full'?'mid':S.state==='mid'?'peek':'mid');dy=null;return}
  const v=innerHeight;
  snap(px>v*.7?'full':px<v*.26?'peek':'mid');dy=null;
},{passive:true});
g.onclick=()=>{if(dy===null&&!('ontouchstart'in window))
  snap(S.state==='full'?'mid':S.state==='mid'?'peek':'mid')};

function selectStation(i){
  S.selStn=i;renderNearby();plotStations();plotEntrances(i);
  const st=S.stations[i];
  if(mapOK&&st) map.easeTo({center:[st.location[1],st.location[0]],zoom:16.2});
}
Object.assign(window,{locate,goHotel,fetchNearby,setOrigin,clearDest,
  saveDest,saveHere,goSaved,delSaved,addTap,undoTap,hideTip,selectStation});

function boot(){
  if(booted)return;booted=true;
  initMap();loadAll();renderTrip();snap('mid');
  $('p-near').innerHTML=hotelCard()+'<div class="skel"></div><div class="skel"></div>';
  fetchNearby();locate(false);
  setInterval(()=>{if(S.tab==='near'||S.state==='peek')fetchNearby()},45000);
  setInterval(()=>{if(S.state==='peek')renderPeek()},15000);
}
</script>
</body>
